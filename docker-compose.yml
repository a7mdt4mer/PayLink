services:
  app:
    build: .                       
    ports:
      - "8000:8000"                 
    depends_on:
      - db                          

  db:
    image: mysql:8                  
    environment:
      MYSQL_ROOT_PASSWORD: paylink_dev   
      MYSQL_DATABASE: paylink            
    volumes:
      - mysql-data:/var/lib/mysql   
volumes:
  mysql-data:                       